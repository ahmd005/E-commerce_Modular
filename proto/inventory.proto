syntax = "proto3";
package inventory;

service InventoryService {
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc UpdateStock (UpdateStockRequest) returns (ProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (Empty);
  rpc ReserveStock (StockRequest) returns (ProductResponse);
  rpc ReleaseStock (StockRequest) returns (ProductResponse);
  rpc ListProducts (Empty) returns (ProductListResponse); 
}

message ProductListResponse {
  repeated ProductResponse data = 1;
}

message CreateProductRequest {
  string name = 1;
  string sku = 2;
  int32 initial_quantity = 3;
}

message UpdateStockRequest {
  string product_id = 1;
  int32 delta = 2;
}

message DeleteProductRequest {
  string product_id = 1;
}

message StockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  string sku = 3;
  int32 quantity = 4;
  bool in_stock = 5;
}

message Empty {}
